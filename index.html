<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Мережа видавничо-поліграфічного холдингу – Supabase</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="script.js"></script>
</head>
<body>
  <main class="container">
    <h1>Обчислювальна мережа видавничо-поліграфічного холдингу</h1>
    <p>Реєстр мережевого обладнання (Supabase, PostgreSQL).</p>
    <p id="status" role="status" aria-live="polite"></p>

    <section aria-labelledby="list-heading">
      <h2 id="list-heading">1. Перегляд обладнання (SELECT), пошук, сортування, фільтр</h2>

      <div class="controls">
        <label for="search">Пошук за назвою</label>
        <input id="search" type="search" placeholder="Наприклад: SW">

        <label for="type-filter">Тип пристрою</label>
        <select id="type-filter">
          <option value="">Усі типи</option>
        </select>

        <label for="sort">Сортування</label>
        <select id="sort">
          <option value="id:asc">За id (за зростанням)</option>
          <option value="name:asc">Назва (А–Я)</option>
          <option value="name:desc">Назва (Я–А)</option>
          <option value="department:asc">Підрозділ (А–Я)</option>
          <option value="ip_address:asc">IP-адреса</option>
          <option value="created_at:desc">Спочатку нові</option>
        </select>
      </div>

      <ul id="devices-list"></ul>
    </section>

    <section aria-labelledby="form-heading">
      <h2 id="form-heading">2. Додавання пристрою (INSERT)</h2>
      <form id="device-form">
        <label for="name">Назва пристрою</label>
        <input id="name" name="name" required maxlength="100">

        <label for="device_type">Тип</label>
        <select id="device_type" name="device_type" required></select>

        <label for="department">Підрозділ</label>
        <input id="department" name="department" required maxlength="100">

        <label for="ip_address">IP-адреса</label>
        <input id="ip_address" name="ip_address" required maxlength="15"
               pattern="(\d{1,3}\.){3}\d{1,3}" placeholder="10.0.0.10">

        <button type="submit">Додати</button>
      </form>
    </section>
  </main>
</body>
</html>
